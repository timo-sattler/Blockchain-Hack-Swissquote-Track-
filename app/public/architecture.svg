<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Architecture of the two-part Swissquote wallet: the client's devices hold identical copies of part A, Swissquote's share service holds part B, an independent escrow agent holds a copy of part B for the grace period">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6170"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .a { stroke: #2563eb; }
      .b { stroke: #e30613; }
      .e { stroke: #b45309; }
      .chain { fill: #f6f7f9; }
      .title { font-size: 22px; font-weight: 700; fill: #11141a; }
      .line { font-size: 16px; fill: #3d4350; }
      .muted { font-size: 14px; fill: #646b78; }
      .badge { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .edge { stroke: #5b6170; stroke-width: 2; fill: none; }
      .dashed { stroke-dasharray: 8 7; }
      .label { font-size: 14px; fill: #3d4350; font-weight: 600; }
      .caption { font-size: 17px; fill: #11141a; font-weight: 600; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#ffffff"/>

  <!-- signed transactions from the devices -->
  <path class="edge" d="M190 80V36H1100V80" marker-end="url(#arrow)"/>
  <text x="640" y="28" text-anchor="middle" class="label">signed transactions (Bitcoin, Base)</text>

  <!-- client devices -->
  <rect class="box a" x="40" y="80" width="300" height="150" rx="16"/>
  <circle cx="72" cy="114" r="15" fill="#2563eb"/><text x="72" y="119" text-anchor="middle" class="badge">A</text>
  <text x="96" y="121" class="title">Your laptop</text>
  <text x="62" y="162" class="line">Swissquote app · your part</text>
  <text x="62" y="190" class="line">Unlocked with Face ID</text>

  <rect class="box a" x="40" y="340" width="300" height="150" rx="16"/>
  <circle cx="72" cy="374" r="15" fill="#2563eb"/><text x="72" y="379" text-anchor="middle" class="badge">A</text>
  <text x="96" y="381" class="title">Your phone</text>
  <text x="62" y="422" class="line">Identical copy of your part</text>
  <text x="62" y="450" class="line">Its own Face ID passkey</text>

  <path class="edge dashed" d="M190 230V338" marker-end="url(#arrow)"/>
  <text x="204" y="270" class="label">Add a device:</text>
  <text x="204" y="290" class="muted">one-time link, copy encrypted</text>
  <text x="204" y="308" class="muted">so Swissquote cannot read it</text>

  <!-- Swissquote -->
  <rect class="box b" x="480" y="80" width="360" height="270" rx="16"/>
  <circle cx="512" cy="114" r="15" fill="#e30613"/><text x="512" y="119" text-anchor="middle" class="badge">B</text>
  <text x="536" y="121" class="title">Swissquote share service</text>
  <text x="502" y="148" class="muted">separate process · own storage</text>
  <text x="502" y="184" class="line">• Swissquote's part (never leaves)</text>
  <text x="502" y="212" class="line">• Checks the Face ID login</text>
  <text x="502" y="240" class="line">• Screens every recipient</text>
  <text x="502" y="268" class="line">• Policy: USDC · EURC · ETH · BTC</text>
  <text x="502" y="296" class="line">• Pays USDC / EURC fees</text>
  <text x="502" y="330" class="muted">Never signs alone</text>

  <path class="edge" d="M342 150H478" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="410" y="136" text-anchor="middle" class="label">2-of-2 MPC</text>
  <text x="410" y="172" text-anchor="middle" class="muted">messages only</text>
  <path class="edge" d="M342 410C410 410 420 330 478 300" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- blockchains -->
  <rect class="box chain" x="960" y="80" width="280" height="110" rx="16"/>
  <text x="984" y="124" class="title">Base Sepolia</text>
  <text x="984" y="156" class="line">USDC · EURC · ETH</text>
  <rect class="box chain" x="960" y="230" width="280" height="110" rx="16"/>
  <text x="984" y="274" class="title">Bitcoin testnet4</text>
  <text x="984" y="306" class="line">Same key, SegWit address</text>
  <path class="edge" d="M842 150H958" marker-end="url(#arrow)"/>
  <text x="900" y="136" text-anchor="middle" class="label">gasless relay</text>

  <!-- escrow -->
  <rect class="box e" x="480" y="470" width="360" height="160" rx="16"/>
  <circle cx="512" cy="504" r="15" fill="#b45309"/><text x="512" y="509" text-anchor="middle" class="badge">B</text>
  <text x="536" y="511" class="title">Escrow agent (mock)</text>
  <text x="502" y="548" class="line">Copy of Swissquote's part</text>
  <text x="502" y="576" class="line">After the grace period (6 months;</text>
  <text x="502" y="602" class="line">demo 30 s) it goes to your device</text>
  <path class="edge dashed" d="M660 352V468" marker-end="url(#arrow)"/>
  <text x="674" y="410" class="label">copy at creation</text>
  <path class="edge dashed" d="M478 560C420 560 400 470 342 460" marker-end="url(#arrow)"/>
  <text x="372" y="590" class="label">takeover</text>

  <!-- event hub -->
  <rect class="box" x="960" y="470" width="280" height="160" rx="16"/>
  <text x="984" y="514" class="title">Event hub</text>
  <text x="984" y="548" class="line">Live presentation</text>
  <text x="984" y="576" class="muted">/present.html</text>
  <path class="edge" d="M842 320C900 320 900 520 958 520" marker-end="url(#arrow)"/>
  <text x="912" y="430" class="label">events</text>

  <text x="640" y="700" text-anchor="middle" class="caption">The full private key never exists. Swissquote alone, or Swissquote + the escrow copy (the same part), cannot sign.</text>
</svg>
