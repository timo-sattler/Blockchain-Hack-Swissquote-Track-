<circle cx="976" cy="110" r="18" fill="#f05a2a"/>
<text x="976" y="117" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">5</text>
<text x="962" y="176" fill="#fff" font-size="25" font-weight="700">Co-sign</text>
<text x="962" y="218" fill="#d6d6d6" font-size="17.5">Part A + Part B</text>
<text x="962" y="245" fill="#d6d6d6" font-size="17.5">sign together (MPC):</text>
<text x="962" y="272" fill="#d6d6d6" font-size="17.5">key never assembled</text>
<line x1="1140" y1="205.0" x2="1166" y2="205.0" stroke="#bdbdbd" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1268.0" y="48" text-anchor="middle" fill="#bdbdbd" font-size="17" font-weight="600">Ethereum</text>
<rect x="1170" y="70" width="196" height="270" rx="14" fill="#474747" stroke="#6a6a6a" stroke-width="2"/>
<circle cx="1206" cy="110" r="18" fill="#5f5f5f"/>
<text x="1206" y="117" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">6</text>
<text x="1192" y="176" fill="#fff" font-size="25" font-weight="700">Send</text>
<text x="1192" y="218" fill="#d6d6d6" font-size="17.5">Broadcast, or</text>
<text x="1192" y="245" fill="#d6d6d6" font-size="17.5">Swissquote relays</text>
<text x="1192" y="272" fill="#d6d6d6" font-size="17.5">and pays the fee</text>
<text x="700" y="392" text-anchor="middle" fill="#bdbdbd" font-size="18">Swissquote approves with a one-time ticket for this payment only. The vault signs nothing else, and never without your Face ID.</text>
